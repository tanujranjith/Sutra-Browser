<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sutra LMS Capture</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            width: min(340px, 100vw);
            min-width: 0;
            box-sizing: border-box;
            margin: 0;
            padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 13px;
        }
        h1 { font-size: 15px; margin: 0 0 4px; }
        p { margin: 4px 0 10px; opacity: 0.8; }
        button {
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid rgba(127, 127, 127, 0.4);
            background: transparent;
            color: inherit;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            touch-action: manipulation;
        }
        button:hover:not(:disabled) { background: rgba(127, 127, 127, 0.12); }
        button:disabled { opacity: 0.5; cursor: default; }
        #captureBtn { border-color: #7c6cf5; }
        #status { min-height: 18px; margin: 2px 0 8px; font-weight: 600; }
        #status.error { color: #d05555; }
        #preview {
            width: 100%;
            height: 110px;
            box-sizing: border-box;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid rgba(127, 127, 127, 0.4);
            background: transparent;
            color: inherit;
            display: none;
        }
        .actions { display: none; }
        footer { margin-top: 8px; font-size: 11px; opacity: 0.6; }
        footer a { color: inherit; }
        @media (max-width: 320px) {
            body { padding-inline: 10px; }
        }
    </style>
</head>
<body>
    <h1>Sutra LMS Capture</h1>
    <p>Open your LMS (Canvas works best), then capture. You review every row inside Sutra before anything is saved.</p>
    <button id="captureBtn" type="button">Capture assignments from this page</button>
    <div id="status" role="status"></div>
    <textarea id="preview" readonly aria-label="Captured assignments preview"></textarea>
    <div class="actions" id="actions">
        <button id="sendBtn" type="button">Send to Sutra</button>
        <button id="copyBtn" type="button">Copy (paste into Sutra&rsquo;s import box)</button>
    </div>
    <footer><a href="#" id="optionsLink">Set your Sutra address</a> &middot; runs only when you click, sends nothing to any server</footer>
    <script src="popup.js"></script>
</body>
</html>
