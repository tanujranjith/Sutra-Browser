<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sutra LMS Capture — Options</title>
    <style>
        :root { color-scheme: light dark; }
        body { width: 100%; min-width: 0; max-width: 42rem; box-sizing: border-box; margin: 0 auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; overflow-wrap: anywhere; }
        h1 { font-size: 15px; margin: 0 0 10px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; }
        input {
            width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
            border: 1px solid rgba(127, 127, 127, 0.4); background: transparent; color: inherit; font: inherit; font-size: 16px; min-height: 44px;
        }
        p { opacity: 0.75; }
        button {
            margin-top: 10px; padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600;
            border: 1px solid rgba(127, 127, 127, 0.4); background: transparent; color: inherit; cursor: pointer; min-height: 44px; touch-action: manipulation;
        }
        #saved { margin-left: 8px; font-weight: 600; opacity: 0; transition: opacity 0.2s; }
        #saved.show { opacity: 1; }
    </style>
</head>
<body>
    <h1>Sutra LMS Capture</h1>
    <label for="sutraUrl">Your Sutra address</label>
    <input id="sutraUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://tanujranjith.github.io/Sutra/Sutra.html">
    <p>"Send to Sutra" opens this address. Automatic hand-off works for the official Sutra site and localhost; for a Sutra hosted anywhere else, use the Copy button and paste into Sutra's import box.</p>
    <button id="saveBtn" type="button">Save</button><span id="saved">Saved</span>
    <script src="options.js"></script>
</body>
</html>
