<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0D0F">
  <title>Sutra Browser — New tab</title>
  <meta name="description" content="A quiet, art-directed start page for Sutra Browser.">
  <link rel="icon" href="../Assets/sutra.ico">
  <link rel="stylesheet" href="css/afterglow.css">
  <link rel="stylesheet" href="css/workspace.css">
</head>
<body>
  <div class="afterglow-shell" data-art="afterglow" data-dock="lower-left">
    <div class="artwork" aria-hidden="true"></div>

    <header class="page-controls">
      <span class="canvas-date" id="canvas-date"></span>
      <button class="customize-link" id="btn-customize" type="button">Customize</button>
    </header>

    <main class="canvas" aria-label="Sutra new tab">
      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow"><span aria-hidden="true">◆</span> YOUR SPACE ON THE WEB</p>
        <h1 id="welcome-title">Room to think.<br><span>Space to explore.</span></h1>
        <p class="welcome-description">Pick up a thought. Find something new. Make it yours.</p>
      </section>

      <form class="command-dock" id="search-form" role="search" autocomplete="off">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <label class="sr-only" for="search-input">Search or enter address</label>
        <input id="search-input" name="q" type="search" placeholder="Search or enter address"
               autocomplete="off" spellcheck="false" maxlength="2048">
        <span class="shortcut" aria-hidden="true">Ctrl K</span>
        <button class="submit-button" type="submit" aria-label="Go">
          <span aria-hidden="true">→</span>
        </button>
        <div class="suggestions" id="suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
      </form>
      <nav class="quick-access" aria-label="Your browser">
        <button type="button" data-action="library"><span class="quick-icon" aria-hidden="true">⌕</span><span>Library</span></button>
        <button type="button" data-action="bookmarks"><span class="quick-icon" aria-hidden="true">☆</span><span>Bookmarks</span></button>
        <button type="button" data-action="workspaces"><span class="quick-icon" aria-hidden="true">▦</span><span>Workspaces</span></button>
        <button type="button" data-action="offline"><span class="quick-icon" aria-hidden="true">↓</span><span>Offline reading</span></button>
        <button type="button" data-action="notes"><span class="quick-icon" aria-hidden="true">✎</span><span>Page notes</span></button>
        <button type="button" data-action="history"><span class="quick-icon" aria-hidden="true">↶</span><span>History</span></button>
      </nav>
      <section class="continue-grid" aria-label="Make more of your browser">
        <button class="feature-card" type="button" data-action="reading"><span class="card-label">KEEP YOUR CURIOSITY</span><strong>A little reading, for later.</strong><span>Return to your reading list <b aria-hidden="true">↗</b></span></button>
        <button class="feature-card" type="button" data-action="commands"><span class="card-label">A SHORTCUT TO EVERYTHING</span><strong>Less clicking. More doing.</strong><span>Open the command palette <kbd>Ctrl Shift P</kbd></span></button>
      </section>
      <footer class="canvas-footer"><span>Built around your focus.</span><button type="button" data-action="settings">Browser settings <span aria-hidden="true">↗</span></button></footer>
    </main>

    <dialog class="customize-dialog" id="customize-dialog" aria-labelledby="customize-title">
      <form method="dialog" class="dialog-card">
        <div class="dialog-heading">
          <div>
            <p class="dialog-kicker">Sutra canvas</p>
            <h2 id="customize-title">Customize</h2>
          </div>
          <button class="dialog-close" value="cancel" aria-label="Close">×</button>
        </div>
        <label class="setting-row">
          <span>Atmosphere</span>
          <select id="art-mode">
            <option value="afterglow">Afterglow</option>
            <option value="quiet">Quiet black</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Canvas layout</span>
          <select id="dock-position">
            <option value="lower-left">Editorial</option>
            <option value="bottom-center">Centered</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button class="dialog-reset" id="reset-settings" type="button">Reset</button>
          <button class="dialog-save" value="save">Done</button>
        </div>
      </form>
    </dialog>

    <div class="live-region" id="live" aria-live="polite"></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/afterglow.js"></script>
</body>
</html>
